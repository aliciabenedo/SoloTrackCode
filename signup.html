<!DOCTYPE html>
<html>
<head>
  <title>SoloTrack Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="login-main">
    <h2>Sign Up for SoloTrack</h2>
    <div class="login-box">
      <input type="text" id="new-username" placeholder="Create Username">
      <input type="password" id="new-password" placeholder="Create Password">
      <button type="button" onclick="signUp()">Sign Up</button>
      <p id="signup-message" class="message"></p>
    </div>
    <button onclick="toggleDarkMode()" id="theme-toggle" class="btn">Dark Mode</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
