<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SoloTrack - Clients</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SoloTrack</h1>
    <nav>
      <ul class="nav-list">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="clients.html" class="active">Clients</a></li>
        <li><a href="invoices.html">Invoices</a></li>
        <li><a href="summary.html">Summary</a></li>
        <li><a href="profile.html">Profile</a></li>
      </ul>
      <button onclick="toggleDarkMode()" id="theme-toggle" class="btn">Dark Mode</button>
    </nav>
  </header>

  <main class="container">
    <h2>Clients</h2>

    <div class="form-group">
      <input type="text" id="client-name" placeholder="Name">
      <input type="email" id="client-email" placeholder="Email">
      <input type="text" id="client-phone" placeholder="Phone">
      <button onclick="addClient()">Add Client</button>
      <p id="form-message" class="message"></p>
    </div>

    <input type="text" id="search-client" placeholder="Search clients..." oninput="filterClients()">

    <ul id="client-list" class="client-list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
