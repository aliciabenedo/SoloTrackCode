<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SoloTrack - My Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>SoloTrack</h1>
    <nav>
      <ul class="nav-list">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="clients.html">Clients</a></li>
        <li><a href="invoices.html">Invoices</a></li>
        <li><a href="summary.html">Summary</a></li>
        <li><a href="profile.html" class="active">Profile</a></li>
      </ul>
      <button onclick="toggleDarkMode()" id="theme-toggle" class="btn">Dark Mode</button>
    </nav>
  </header>

  <main class="dashboard-main">
    <h2>My Account</h2>
    <p>Welcome, <span id="profile-username"></span></p>

    <div class="form-group">
      <button onclick="logout()" class="btn">Logout</button>
      <button onclick="location.href='signup.html'" class="btn" style="background-color:#8e44ad;">Sign Up</button>
    </div>
  </main>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    document.getElementById('profile-username').innerText = user ? user.username : 'Guest';

    function logout() {
      localStorage.removeItem('loggedIn');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
