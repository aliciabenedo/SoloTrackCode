<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SoloTrack - My Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>SoloTrack</h1>
    <nav>
      <ul class="nav-list">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="clients.html">Clients</a></li>

    </nav>

  <main class="dashboard-main">
    <h2>My Account</h2>

    document.getElementById('profile-username').innerText = user ? user.username : 'Guest';
