<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SoloTrack - Invoices</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <header>
    <h1>SoloTrack</h1>
    <nav>
      <ul class="nav-list">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="clients.html">Clients</a></li>
        <li><a href="invoices.html" class="active">Invoices</a></li>
        <li><a href="summary.html">Summary</a></li>
        <li><a href="profile.html">Profile</a></li>
      </ul>
      <button onclick="toggleDarkMode()" id="theme-toggle" class="btn">Dark Mode</button>

    </nav>
  </header>

  <main class="container">
    <h2>Manage Invoices</h2>

    <section class="form-section">
      <div class="form-group">
        <input type="text" id="invoice-client" placeholder="Client Name">
        <input type="number" id="invoice-amount" placeholder="Amount (€)" min="0" step="0.01">
        <input type="date" id="invoice-date">
        <button onclick="addInvoice()">Add Invoice</button>
      </div>
      <p id="invoice-message" class="message"></p>
    </section>

    <section class="filter-sort">
      <input type="text" id="search-invoice" placeholder="Search invoices..." oninput="filterInvoices()">
      <select onchange="sortInvoices(this.value)">
        <option value="">Sort By</option>
        <option value="date">Date</option>
        <option value="amount">Amount</option>
      </select>
    </section>

    <ul id="invoice-list" class="invoice-list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
